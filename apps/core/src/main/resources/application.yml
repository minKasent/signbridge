spring:
  application:
    name: signbridge-core

  config:
    # Nạp key từ .env ở gốc repo (định dạng KEY=VALUE trùng chuẩn .properties).
    # optional: → thiếu file vẫn chạy được (CI, máy khác).
    import: optional:file:../../.env[.properties]

  # Tự động bật hạ tầng (Postgres + MinIO) từ docker-compose gốc khi chạy dev
  docker:
    compose:
      file: ../../docker-compose.yml
      lifecycle-management: start_only

  datasource:
    url: jdbc:postgresql://localhost:5432/signbridge
    username: signbridge
    password: signbridge

  jpa:
    hibernate:
      ddl-auto: update # dev only — sẽ chuyển sang Flyway migration ở giai đoạn sau
    open-in-view: false

  modulith:
    events:
      # Xóa bản ghi sự kiện sau khi xử lý xong — mỗi gloss nhận diện được sinh
      # một dòng event_publication, giữ lại hết sẽ phình vô hạn trên hot path.
      completion-mode: delete
      # Listener giờ ghi DB (analytics) nên có thể fail giữa chừng: phát lại các
      # sự kiện chưa hoàn tất khi khởi động, không thì chúng nằm lại vĩnh viễn.
      republish-outstanding-events-on-restart: true

server:
  port: 8080

spring.servlet.multipart:
  # Clip ký hiệu từ điển ~0.3-3MB; mặc định 1MB làm rớt upload (HTTP 413)
  max-file-size: 25MB
  max-request-size: 26MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

signbridge:
  ml:
    base-url: http://localhost:8000
  llm:
    # Ghép chuỗi gloss thành câu tiếng Việt tự nhiên. Không có key → tự động
    # dùng cách ghép dự phòng từ nghĩa trong từ điển, hệ thống vẫn chạy.
    base-url: https://generativelanguage.googleapis.com
    model: gemini-flash-latest
    api-key: ${GEMINI_API_KEY:}
    timeout-seconds: 8
  security:
    # DEV ONLY — prod đặt qua biến môi trường SIGNBRIDGE_SECURITY_JWT_SECRET (>= 32 byte)
    jwt-secret: "signbridge-dev-secret-doi-khi-len-prod-0123456789abcdef"
    # Tài khoản quản trị duy nhất, tạo lúc khởi động (prod: đặt qua biến môi trường)
    admin-email: admin@signbridge.vn
    admin-password: signbridge-admin-dev
  storage:
    clips-dir: ../../storage/clips
    dataset-dir: ../../storage/dataset
