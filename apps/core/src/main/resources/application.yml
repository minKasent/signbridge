spring:
  application:
    name: signbridge-core

  # Tự động bật hạ tầng (Postgres + MinIO) từ docker-compose gốc khi chạy dev
  docker:
    compose:
      file: ../../docker-compose.yml
      lifecycle-management: start_only

  datasource:
    url: jdbc:postgresql://localhost:5432/signbridge
    username: signbridge
    password: signbridge

  jpa:
    hibernate:
      ddl-auto: update # dev only — sẽ chuyển sang Flyway migration ở giai đoạn sau
    open-in-view: false

  modulith:
    events:
      # Xóa bản ghi sự kiện sau khi xử lý xong — mỗi gloss nhận diện được sinh
      # một dòng event_publication, giữ lại hết sẽ phình vô hạn trên hot path.
      completion-mode: delete

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

signbridge:
  ml:
    base-url: http://localhost:8000
  security:
    # DEV ONLY — prod đặt qua biến môi trường SIGNBRIDGE_SECURITY_JWT_SECRET (>= 32 byte)
    jwt-secret: "signbridge-dev-secret-doi-khi-len-prod-0123456789abcdef"
    # Tài khoản quản trị duy nhất, tạo lúc khởi động (prod: đặt qua biến môi trường)
    admin-email: admin@signbridge.vn
    admin-password: signbridge-admin-dev
  storage:
    clips-dir: ../../storage/clips
    dataset-dir: ../../storage/dataset
